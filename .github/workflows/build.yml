name: Build PSP

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with pspdev
        run: |
          docker run --rm -v "$PWD":/src -w /src pspdev/pspdev:latest make

      - name: Package (PSP/GAME layout)
        run: |
          mkdir -p dist/PSP/GAME/bmxlite
          cp EBOOT.PBP dist/PSP/GAME/bmxlite/
          cd dist && zip -r ../bmxlite.zip PSP

      - uses: actions/upload-artifact@v4
        with:
          name: bmxlite
          path: |
            EBOOT.PBP
            bmxlite.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EBOOT.PBP
            bmxlite.zip
